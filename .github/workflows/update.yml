name: Goi y video moi

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goi-y:
    runs-on: ubuntu-latest
    steps:
      - name: Lay code
        uses: actions/checkout@v5
      - name: Cai Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cai thu vien
        run: pip install feedparser google-genai requests cloudscraper
      - name: Quet kenh va goi y video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python fetch.py
      - name: Nhan JSON tu Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
      - name: Luu thay doi vao kho
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add suggestions.json 2>/dev/null || true
          git add substack_inbox.json 2>/dev/null || true
          git add data.json 2>/dev/null || true
          git add telegram_state.json 2>/dev/null || true
          git commit -m "Cap nhat tu dong + telegram" || echo "Khong co thay doi"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push chua duoc, thu lai lan $i..."; sleep 5
          done
          exit 1
