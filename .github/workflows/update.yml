name: Cap nhat nhan dinh chuyen gia

on:
  schedule:
    - cron: '0 * * * *'     # chay moi gio; fetch.py tu quyet co toi gio khong
  workflow_dispatch:          # nut "Run workflow" = chay ngay (bat ke gio)

permissions:
  contents: write

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    steps:
      - name: Lay code
        uses: actions/checkout@v4
      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cai thu vien
        run: pip install feedparser google-genai youtube-transcript-api requests
      - name: Chay robot lay tin
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python fetch.py
      - name: Luu data.json vao kho
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "Cap nhat nhan dinh tu dong" || echo "Khong co thay doi"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push chua duoc, thu lai lan $i..."; sleep 5
          done
          exit 1
