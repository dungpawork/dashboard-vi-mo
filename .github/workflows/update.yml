name: Goi y video moi

on:
  schedule:
    - cron: '0 * * * *'     # chay moi gio; fetch.py tu quyet co toi gio khong
  workflow_dispatch:          # nut "Run workflow" = chay ngay (bat ke gio)

permissions:
  contents: write

jobs:
  goi-y:
    runs-on: ubuntu-latest
    steps:
      - name: Lay code
        uses: actions/checkout@v5
      - name: Cai Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cai thu vien
        run: pip install feedparser google-genai requests
      - name: Quet kenh va goi y video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python fetch.py
      - name: Luu suggestions.json vao kho
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add suggestions.json
          git commit -m "Goi y video moi" || echo "Khong co thay doi"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push chua duoc, thu lai lan $i..."; sleep 5
          done
          exit 1
