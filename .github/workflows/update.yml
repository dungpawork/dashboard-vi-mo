name: Cap nhat tin kinh te

on:
  schedule:
    - cron: '0 0 * * *'    # 07:00 gio Viet Nam (00:00 UTC)
    - cron: '0 5 * * *'    # 12:00 gio Viet Nam (05:00 UTC)
    - cron: '0 8 * * *'    # 15:00 gio Viet Nam (08:00 UTC)
    - cron: '0 13 * * *'   # 20:00 gio Viet Nam (13:00 UTC)
  workflow_dispatch:        # nut "Run workflow" de cap nhat bang tay

permissions:
  contents: write

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    steps:
      - name: Lay code
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cai thu vien
        run: pip install feedparser google-genai trafilatura

      - name: Chay robot lay tin
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch.py

      - name: Luu data.json vao kho
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "Cap nhat tin tu dong" || echo "Khong co tin moi"
          git push
