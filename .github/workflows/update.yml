name: Cap nhat tin kinh te

on:
  schedule:
    - cron: '0 * * * *'     # chay moi gio; robot tu quyet block nao toi gio
  workflow_dispatch:          # nut "Run workflow" = cap nhat tay (chay moi block)

permissions:
  contents: write

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    steps:
      - name: Lay code
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cai thu vien
        run: pip install feedparser google-genai trafilatura

      - name: Chay robot lay tin
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python fetch.py

      - name: Luu data.json vao kho
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "Cap nhat tin tu dong" || echo "Khong co tin moi"
          git push
